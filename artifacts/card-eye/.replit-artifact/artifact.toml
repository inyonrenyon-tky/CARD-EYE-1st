kind = "mobile"
previewPath = "/card-eye/"
title = "CARD EYE"
description = "A dark-themed Japanese mobile app that makes Pokémon card values approachable through scanning, collections, alerts, and personal insights."
version = "1.0.0"
id = "artifacts/card-eye"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/card-eye/" ]
localPort = 24158

[services.development]
run = "pnpm --filter @workspace/card-eye run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/card-eye", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/card-eye", "run", "serve" ]

[services.env]
PORT = "24158"
BASE_PATH = "/card-eye/"
